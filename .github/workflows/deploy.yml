name: Deploy to GitHub Pages # Nombre visible en la pestaña Actions de GitHub

on:
  push:
    branches:
      - main

permissions:
  contents: read   # Permite leer los archivos del repositorio
  pages: write     # Permite desplegar el sitio en GitHub Pages
  id-token: write  # Token de seguridad OIDC para autenticar el despliegue

# Control de ejecuciones simultáneas
concurrency:
  group: "pages"
  cancel-in-progress: true # Cancela despliegues viejos si subes un cambio nuevo rápido

jobs:
  # Build y deploy en un solo job para ahorrar tiempo de arranque de máquina
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # Muestra el enlace web al finalizar
    runs-on: ubuntu-latest # Sistema operativo temporal donde corren los comandos

    steps:
      # 1. Descarga el código de tu repositorio en la máquina virtual
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configura Node.js y activa la caché de paquetes para acelerar futuras ejecuciones
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instala dependencias exactas desde package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Verifica JavaScript, compila el sitio y valida el HTML generado
      - name: Lint
        run: npm run lint

      # 5. Empaqueta la carpeta _site como un artefacto listo para publicar
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      # 6. Publica el artefacto en los servidores de GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
