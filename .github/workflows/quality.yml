name: Quality & Security Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  quality:
    name: Linter & SonarQube Cloud
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código con historial completo (fijado por SHA para mayor seguridad)
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # 2. Configura Node.js y la caché de npm
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instala dependencias exactas
      - name: Install dependencies
        run: npm ci

      # 4. Ejecuta ESLint (.js), compila Eleventy (.njk) y valida HTMLHint
      - name: Run Linters & Build
        run: npm run lint

      # 5. Caché del motor de SonarQube para acelerar futuros escaneos
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # 6. Escaneo de seguridad y calidad (SAST) en SonarQube Cloud
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
